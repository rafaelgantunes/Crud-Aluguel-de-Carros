# ==============================================================================
# PUC Minas - DIAW - LAB02: Sistema de Aluguel de Carros
# Configuração Principal (Funciona imediatamente com H2 em qualquer máquina
# sem precisar de credenciais externas, ou usa o Supabase se configurado)
# ==============================================================================
spring.application.name=sistema-aluguel-carros
server.port=8080

# ------------------------------------------------------------------------------
# Banco de Dados Padrão (H2 em memória com compatibilidade PostgreSQL)
# Permite que colegas/professor rodem o projeto direto após clonar sem senha!
# ------------------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:alugueldb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SUPABASE_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# Configuração HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

