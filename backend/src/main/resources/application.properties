# ==============================================================================
# PUC Minas - DIAW - LAB02: Sistema de Aluguel de Carros
# Configuração Principal (Spring Boot 4.0.x + JDK 25 + Supabase PostgreSQL)
# ==============================================================================
spring.application.name=sistema-aluguel-carros
server.port=8080

# Importa automaticamente o arquivo local 'application-supabase.properties' (ignorado no Git)
# caso exista na máquina do desenvolvedor.
spring.config.import=optional:classpath:application-supabase.properties

# ------------------------------------------------------------------------------
# Conexão com o Banco de Dados (Via variáveis de ambiente ou fallback local H2)
# ------------------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:alugueldb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# Configuração HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
